---
- name: Configure the infrastructure lab web server
  hosts: linux_servers
  become: true

  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        name:
          - nginx
          - curl
          - htop
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Deploy infrastructure test page
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: |
          Infrastructure Engineering Lab
          Project 001 - Ansible
          Managed automatically.
        owner: root
        group: root
        mode: '0644'

    - name: Ensure Nginx is enabled and running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
