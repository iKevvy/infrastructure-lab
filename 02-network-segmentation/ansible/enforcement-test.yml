---
- name: Project 002 - Firewall enforcement test
  hosts: all
  gather_facts: false
  become: true

  tasks:
    - name: Verify target
      ansible.builtin.assert:
        that:
          - inventory_hostname == "10.77.105.105"

    - name: Check experimental table is absent
      ansible.builtin.command:
        cmd: /usr/sbin/nft list table ip ct105_lab
      register: existing
      failed_when: false
      changed_when: false

    - name: Require absent experimental table
      ansible.builtin.assert:
        that:
          - existing.rc != 0
          - "'No such file or directory' in existing.stderr"

    - name: Confirm temporary listener is active
      ansible.builtin.command:
        cmd: systemctl is-active ct105-test-http-8088.service
      register: listener
      changed_when: false
      failed_when: listener.stdout != "active"

    - name: Validate experimental firewall
      ansible.builtin.command:
        cmd: /usr/sbin/nft -c -f /tmp/ct105-lab.nft
      changed_when: false

    - name: Verify rollback script targets IPv4 table
      ansible.builtin.command:
        cmd: cat /usr/local/sbin/ct105-firewall-rollback
      register: rollback
      changed_when: false

    - name: Confirm rollback script
      ansible.builtin.assert:
        that:
          - "'nft delete table ip ct105_lab' in rollback.stdout"

    - name: Schedule independent rollback
      ansible.builtin.command:
        argv:
          - /usr/bin/systemd-run
          - --unit=ct105-enforcement-rollback-001
          - --on-active=180s
          - /usr/local/sbin/ct105-firewall-rollback

    - name: Verify rollback timer
      ansible.builtin.command:
        cmd: systemctl is-active ct105-enforcement-rollback-001.timer
      register: timer
      changed_when: false
      failed_when: timer.stdout != "active"

    - name: Activate firewall
      ansible.builtin.command:
        cmd: /usr/sbin/nft -f /tmp/ct105-lab.nft

    - name: Confirm firewall table is present
      ansible.builtin.command:
        cmd: /usr/sbin/nft list table ip ct105_lab
      changed_when: false
